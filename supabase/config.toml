project_id = "suiyue-academy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "https://class.suiyuecare.com"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 0
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.rate_limit]
email_sent = 0
sms_sent = 30
anonymous_users = 0
token_refresh = 60
sign_in_sign_ups = 20
token_verifications = 20
web3 = 0

[auth.captcha]
# Local Auth uses the fixed test OTP below and has no public internet traffic.
# Hosted Test/Preview/Production must enable Turnstile in the Supabase control
# plane; they do not inherit this local-only config.
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 300

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
template = "你的歲悅學苑驗證碼是 {{ .Code }}，請儘速使用。"

# Deliberately local-only fixed Taiwan-format test identity. Hosted projects
# must not copy this map; they use Twilio Verify and Auth-layer Turnstile.
[auth.sms.test_otp]
886900000000 = "246810"

[auth.sms.twilio_verify]
# A provider must remain enabled for GoTrue's phone flow. The fixed local test
# number above is intercepted by test_otp and does not emit a real SMS; hosted
# environments replace these values in the Supabase control plane.
enabled = true
account_sid = "env(SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID)"
message_service_sid = "env(SUPABASE_AUTH_SMS_TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.hook.mfa_verification_attempt]
enabled = true
uri = "pg-functions://postgres/internal/mfa_verification_attempt"
