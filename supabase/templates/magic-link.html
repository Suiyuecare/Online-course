<!doctype html>
<html lang="zh-Hant">
  <body style="margin:0;background:#fff8ed;font-family:Arial,'Microsoft JhengHei',sans-serif;color:#3a2a1a">
    <div style="max-width:520px;margin:40px auto;background:#fff;border:1px solid #eadfcf;border-radius:20px;padding:32px;text-align:center">
      <p style="margin:0;color:#b45309;font-size:13px;font-weight:700;letter-spacing:2px">歲悅學苑</p>
      <h1 style="margin:18px 0 8px;font-size:24px">你的登入驗證碼</h1>
      <p style="margin:0;color:#76685b;line-height:1.7">請回到歲悅學苑輸入以下六位數字：</p>
      <div style="margin:24px 0;padding:18px;border-radius:14px;background:#fff8ed;color:#5c3800;font-size:34px;font-weight:800;letter-spacing:10px">{{ .Token }}</div>
      <p style="margin:0;color:#938575;font-size:13px;line-height:1.7">驗證碼 10 分鐘後失效。若不是你本人操作，請忽略這封信。</p>
    </div>
  </body>
</html>
